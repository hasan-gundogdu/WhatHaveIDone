name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate repository contract
        run: npm run validate
      - name: Validate Agent Skill
        run: npx --yes skills-ref validate skills/whid
